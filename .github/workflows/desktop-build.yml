name: Build desktop (Windows + Linux)

# Builda os instaladores desktop (Tauri) nativamente em cada plataforma:
# - Windows: roda em runner windows-latest, gera o instalador .exe (NSIS)
# - Linux: roda em runner ubuntu-22.04, gera .deb e .AppImage
# Cross-compile de GUI nativa não é viável, por isso cada plataforma builda na sua própria runner.
#
# Dispara manualmente (aba Actions > Run workflow) ou ao criar uma tag "v*" (ex: v0.5.0).
# Os instaladores ficam disponíveis como artifacts do run, para download na própria aba Actions.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            artifact-name: windows-installer
          - platform: ubuntu-22.04
            artifact-name: linux-bundle

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependências de sistema (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar Rust estável
        uses: dtolnay/rust-toolchain@stable

      - name: Cache de build do Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Instalar dependências do frontend
        run: npm ci

      - name: Build do app desktop
        run: npm run desktop:build

      - name: Subir instalador Windows
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Subir pacotes Linux
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
